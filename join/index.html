<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
    <title>加入我们 | 后宫文档</title>
    <meta name="description" content="打开本页面可通过 QQ 加入蛋白后宫相关交流群，与社区成员交流。">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://doc.dbhg.top/join/">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="后宫文档">
    <meta property="og:title" content="加入我们 | 后宫文档">
    <meta property="og:description" content="打开本页面可通过 QQ 加入蛋白后宫相关交流群，与社区成员交流。">
    <meta property="og:url" content="https://doc.dbhg.top/join/">
    <meta property="og:image" content="https://doc.dbhg.top/images/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="加入我们 | 后宫文档">
    <meta name="twitter:description" content="打开本页面可通过 QQ 加入蛋白后宫相关交流群，与社区成员交流。">
    <meta name="twitter:image" content="https://doc.dbhg.top/images/logo.png">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #20242a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f6f8;
    }

    main {
      width: min(100% - 48px, 420px);
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      border: 4px solid #dce2e8;
      border-top-color: #168cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0;
    }

    p {
      margin: 10px 0 0;
      color: #6b737c;
      font-size: 14px;
      line-height: 1.6;
    }

    .qq-launcher {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>
<body>
  <main aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <h1>正在唤起 QQ</h1>
    <p>请稍候...</p>
  </main>

  <iframe
    class="qq-launcher"
    src="https://qm.qq.com/q/T469Py810Y"
    title="QQ 加群链接"
    tabindex="-1"
    aria-hidden="true"
  ></iframe>
</body>
</html>
